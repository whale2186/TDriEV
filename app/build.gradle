plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'dev.nemesis.drive'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.nemesis.drive'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.2.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions += 'environment'
    productFlavors {
        preview {
            dimension 'environment'
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            buildConfigField 'boolean', 'SIMULATOR', 'true'
            manifestPlaceholders = [appLabel: 'TDriEV Preview']
        }
        owner {
            dimension 'environment'
            buildConfigField 'boolean', 'SIMULATOR', 'false'
            manifestPlaceholders = [appLabel: 'TDriEV']
        }
    }
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation project(':core')
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
